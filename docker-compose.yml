# SQL Server 2022 para desarrollo (alternativa a SQL Server Express en Windows)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personapi-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports: ["1433:1433"]
